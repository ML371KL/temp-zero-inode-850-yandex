# Объяснения сработавших гейтов (docs/MODEL.md §13.2; model/checks.py). Без объяснения сработавший гейт роняет
# сборку; объяснение действует до valid_until и только пока масса (вероятность клеток, где гейт нарушен; с книги 1.2 —
# клетки гейтов капитала и доли терминала по точке, ключ checks.cell_mass) в коридоре expected_mass. Гейт, у которого
# сработали только клетки с вероятностью 0, без объяснения — статус «флаг» (книга 1.2); книга 1.3 такие клетки гейтов
# капитала и доли терминала не считает нарушением (ключ checks.zero_weight_cells, решение Г11). Книга 1.3, дата оценки
# 20.11.2026. Тексты, коридоры и сроки — решения архитектора (рабочий файл, раздел 4: В14, Г4, Г11); клетки и цена —
# по сборке. Гейт отдачи прироста книги 1.3 проходит (обе стороны по одной ставке, решение Г4) — объяснение снято.
# Книга 1.4: объяснение гейта капитала — на числах книги 1.4 (решение точки 3-2); числа сверяет тест
# tests/test_book_14.py::test_equity_explanation_numbers_are_those_of_the_build; цена ограниченной ответственности —
# model.book_results.limited_liability (малая полоса, те же случайные числа).

equity_cushion:
  explanation: >-
    Капитал отрицателен только в крайней клетке стресса с высокими вложениями — «мир M, стресс, высокие вложения»
    (−65,1 млрд); её вес по точке ноль (в стрессе высокого уровня вложений нет), поэтому гейт она не включает. Ближе
    всех к нулю клетки «мир H, стресс, высокие вложения» (+62,4 млрд, вес 0) и «мир M, стресс, базовые вложения»
    (+78,9 млрд). Стресс считается при рыночных ставках как есть; ограниченная ответственность акционеров (капитал
    клетки и прогона полосы не ниже нуля) стоила бы 0 ₽ точки и +16,2 ₽ медианы малой полосы (3 009,9 → 3 026,1 на тех
    же случайных числах). Запас стоимости над требованиями во всех слоях — больше трёх раз (6,8–7,2).
  expected_mass: [0.0, 0.10]
  valid_until: 2027-04-30
